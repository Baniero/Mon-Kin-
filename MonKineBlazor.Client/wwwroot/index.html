<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MonKineBlazor.Client</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link href="MonKineBlazor.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-t67R3QwG+9dSQGkD4Yaf7YY3S+UnuF7hjl6ebsENmol+EOoH8YQ0WbuYpk2aG4u+X4A7aR0tqnb72j5O+P5v6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        if (!window.jspdf && !window.jsPDF) {
            const fallback = document.createElement('script');
            fallback.src = 'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js';
            fallback.crossOrigin = 'anonymous';
            fallback.referrerPolicy = 'no-referrer';
            document.head.appendChild(fallback);
        }

        window.downloadFile = (filename, base64Data) => {
            const link = document.createElement('a');
            link.download = filename;
            link.href = 'data:text/csv;base64,' + base64Data;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.printElement = (elementId) => {
            const element = document.getElementById(elementId);
            if (!element) {
                console.error(`Element with id '${elementId}' not found for printing.`);
                return;
            }

            const printWindow = window.open('', '_blank', 'width=900,height=700');
            if (!printWindow) {
                console.error('Unable to open print window.');
                return;
            }

            const html = `<!DOCTYPE html>
                <html lang="fr">
                <head>
                    <meta charset="utf-8" />
                    <title>Impression fiche patient</title>
                    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
                    <link rel="stylesheet" href="css/app.css" />
                    <style>
                        body { margin: 20px; }
                        .modal { display: block !important; }
                        .modal-backdrop { display: none !important; }
                        .btn, .btn-close { display: none !important; }
                    </style>
                </head>
                <body>${element.innerHTML}</body>
                </html>`;

            printWindow.document.open();
            printWindow.document.write(html);
            printWindow.document.close();
            printWindow.focus();
            printWindow.onload = () => {
                setTimeout(() => {
                    printWindow.print();
                    printWindow.close();
                }, 250);
            };
        };

        const getJsPDF = () => {
            return window.jsPDF ?? window.jspdf?.jsPDF ?? window.jspdf ?? null;
        };

        const getNumber = (obj, pascal, camel) => {
            if (!obj) return 0;
            if (obj[pascal] !== undefined && obj[pascal] !== null) return obj[pascal];
            if (obj[camel] !== undefined && obj[camel] !== null) return obj[camel];
            return 0;
        };

        const getString = (obj, pascal, camel) => {
            if (!obj) return '';
            return obj[pascal] ?? obj[camel] ?? '';
        };

        const drawLabelValue = (doc, label, value, x, y) => {
            doc.setFont('helvetica', 'bold');
            doc.text(label, x, y);
            doc.setFont('helvetica', 'normal');
            doc.text(value, x + 120, y);
        };

        const renderPdfHeader = (doc, data, title) => {
            const margin = 40;
            const headerHeight = 90;
            const centerX = 297.5;
            const leftX = margin;
            const rightX = 360;
            const topY = 40;
            const lineSpacing = 12;

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(18);
            doc.text(title, centerX, topY - 10, { align: 'center' });

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9);

            const leftLines = [
                `Responsable : ${data.cabinet.NomEtablissement || ''}`,
                `Cabinet / établissement : ${data.cabinet.NomCabinet || ''}`,
                `Adresse : ${data.cabinet.AdresseCabinet || ''}`,
                `Tél / GSM : ${data.cabinet.Telephone || ''}`,
                `Matricule fiscal : ${data.cabinet.MatriculeFiscal || ''}`,
                `RIB/RIP : ${data.cabinet.RIB || data.cabinet.RIP || ''}`
            ];

            const rightLines = [
                `Responsable : ${data.cabinet.NomEtablissementArabe || ''}`,
                `Nom du cabinet : ${data.cabinet.NomCabinetArabe || ''}`,
                `Adresse : ${data.cabinet.AdresseKineArabe || ''}`,
                `N° Employeur : ${data.cabinet.NumeroEmployeur || ''}`,
                `Code CNAM : ${data.cabinet.CodeCnam || data.cabinet.CodeEtablissement || ''}`
            ];

            let currentY = topY + 20;
            leftLines.forEach((line) => {
                doc.text(line, leftX, currentY);
                currentY += lineSpacing;
            });

            currentY = topY + 20;
            rightLines.forEach((line) => {
                doc.text(line, rightX, currentY);
                currentY += lineSpacing;
            });

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(48);
            doc.text('⚕', centerX, topY + 50, { align: 'center' });

            doc.setLineWidth(0.5);
            doc.line(margin, topY + headerHeight, 555, topY + headerHeight);
            return topY + headerHeight + 20;
        };

        window.generateInvoicePdf = (filename, data) => {
            const jsPDFClass = getJsPDF();
            if (!jsPDFClass) {
                throw new Error('jsPDF n\'est pas disponible. Vérifiez que le script jsPDF est chargé.');
            }

            const doc = new jsPDFClass({ unit: 'pt', format: 'a4' });
            const margin = 40;
            let y = renderPdfHeader(doc, data, 'FACTURE CNAM');

            doc.setFontSize(10);
            drawLabelValue(doc, 'N° facture :', data.invoiceNumber || '', margin, y);
            drawLabelValue(doc, 'Date facture :', data.invoiceDate || '', 320, y);
            y += 16;
            drawLabelValue(doc, 'Patient :', data.program.PatientName || '', margin, y);
            if (data.program.NumeroAssuree) {
                drawLabelValue(doc, 'N° assurée :', data.program.NumeroAssuree || '', 320, y);
            }
            y += 16;
            drawLabelValue(doc, 'Code patient :', data.program.CodePatient || '', margin, y);
            drawLabelValue(doc, 'Couverture :', data.program.Couverture || '', 320, y);
            y += 24;

            doc.setFont('helvetica', 'bold');
            doc.text('Données de la séance', margin, y);
            y += 18;
            doc.setFont('helvetica', 'normal');
            drawLabelValue(doc, 'Titre :', data.program.Titre || '', margin, y);
            y += 16;
            drawLabelValue(doc, 'Nature :', data.program.NatureSeances || '', margin, y);
            y += 16;
            drawLabelValue(doc, 'Date début :', data.program.DateDebut || '', margin, y);
            y += 16;
            drawLabelValue(doc, 'Date fin :', data.program.DateFin || '', margin, y);
            y += 16;
            drawLabelValue(doc, 'Nb séances :', `${data.program.NbSeances || 0}`, margin, y);
            y += 16;
            drawLabelValue(doc, 'Durée séance :', `${data.program.DureeSeanceMinutes || 0} min`, margin, y);
            y += 16;
            drawLabelValue(doc, 'Prix unitaire :', `${(data.program.PrixUnitaire || 0).toFixed(2)} DT`, margin, y);
            y += 16;
            drawLabelValue(doc, 'Total TTC :', `${(data.program.PrixTTC || 0).toFixed(2)} DT`, margin, y);
            y += 24;
            if (data.program.NumeroAssuree) {
                drawLabelValue(doc, 'Code bureau :', data.program.CodeBureau || '', margin, y);
                y += 16;
                drawLabelValue(doc, 'Année :', data.program.Annee || '', margin, y);
                y += 16;
                drawLabelValue(doc, 'N° décision :', data.program.NumeroDecision || '', margin, y);
                y += 16;
                drawLabelValue(doc, 'N° ordre :', data.program.NumeroOrdre || '', margin, y);
                y += 24;
            }

            doc.setFont('helvetica', 'italic');
            doc.setFontSize(10);
            doc.text('Merci de conserver cette facture pour le dossier CNAM.', margin, y);
            doc.save(filename);
        };

        window.generateBordereauPdf = (filename, data) => {
            const jsPDFClass = getJsPDF();
            if (!jsPDFClass) {
                throw new Error('jsPDF n\'est pas disponible. Vérifiez que le script jsPDF est chargé.');
            }

            const doc = new jsPDFClass({ unit: 'pt', format: 'a4' });
            const margin = 40;
            let y = renderPdfHeader(doc, data, 'BORDEREAU CNAM');
            const formatNumber = (value) => Number(value ?? 0).toFixed(3);
            const summary = data.summary ?? data.Summary ?? {};
            const rows = data.rows ?? data.Rows ?? [];

            doc.setFontSize(10);
            doc.text(`Date : ${summary.Date ?? summary.date ?? ''}`, margin, y);
            doc.text(`Centre : ${summary.Centre ?? summary.centre ?? ''}`, 260, y);
            doc.text(`Nbre séances : ${summary.NbreSeances ?? summary.nbreSeances ?? 0}`, 520, y, { align: 'right' });
            y += 16;
            doc.text(`Année : ${summary.Annee ?? summary.annee ?? ''}`, margin, y);
            doc.text(`Nb factures : ${summary.NbFactures ?? summary.nbFactures ?? 0}`, 260, y);
            doc.text(`Montant total TTC : ${formatNumber(summary.MontantTotalTTC ?? summary.montantTotalTTC)} DT`, 520, y, { align: 'right' });
            y += 20;

            doc.setLineWidth(0.5);
            doc.line(margin, y, 555, y);
            y += 16;

            const headers = ['N° facture', 'Date facture', 'Prise en charge', 'N° assuré', 'Assuré', 'M. HT', 'M TVA', 'M TTC'];
            const widths = [70, 70, 90, 70, 100, 55, 55, 55];
            let x = margin;

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(10);
            headers.forEach((header, index) => {
                doc.text(header, x, y);
                x += widths[index];
            });
            y += 16;
            doc.setLineWidth(0.25);
            doc.line(margin, y, 555, y);
            y += 14;
            doc.setFont('helvetica', 'normal');

            (rows || []).forEach((row) => {
                if (y > 760) {
                    doc.addPage();
                    y = margin;
                }
                x = margin;
                const values = [
                    row.FactureNumber ?? row.factureNumber ?? '',
                    row.DateFacture ?? row.dateFacture ?? '',
                    row.PriseEnCharge ?? row.priseEnCharge ?? '',
                    row.NumeroAssuree ?? row.numeroAssuree ?? '',
                    row.PatientName ?? row.patientName ?? '',
                    formatNumber(row.MontantHT ?? row.montantHT),
                    formatNumber(row.MontantTVA ?? row.montantTVA),
                    formatNumber(row.MontantTTC ?? row.montantTTC)
                ];
                values.forEach((value, index) => {
                    doc.text(String(value), x, y);
                    x += widths[index];
                });
                y += 16;
            });

            y += 18;
            doc.setLineWidth(0.5);
            doc.line(margin, y, 555, y);
            y += 16;
            doc.setFont('helvetica', 'bold');
            doc.text('Total général TTC :', margin, y);
            doc.text(formatNumber(summary.MontantTotalTTC ?? summary.montantTotalTTC) + ' DT', 555, y, { align: 'right' });

            doc.save(filename);
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
