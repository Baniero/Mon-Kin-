<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MonKineBlazor.Client</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link href="MonKineBlazor.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/arabic-reshaper@1.1.0/index.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bidi-js@1.0.3/dist/bidi.min.js" crossorigin="anonymous"></script>
    <script>
        if (!window.jspdf && !window.jsPDF) {
            const fallback = document.createElement('script');
            fallback.src = 'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js';
            fallback.crossOrigin = 'anonymous';
            fallback.referrerPolicy = 'no-referrer';
            document.head.appendChild(fallback);
        }

        window.downloadFile = (filename, base64Data) => {
            const link = document.createElement('a');
            link.download = filename;
            link.href = 'data:text/csv;base64,' + base64Data;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.downloadTextFile = (filename, textContent, mimeType = 'text/plain') => {
            const blob = new Blob([textContent], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        };

        window.printElement = (elementId) => {
            const element = document.getElementById(elementId);
            if (!element) {
                console.error(`Element with id '${elementId}' not found for printing.`);
                return;
            }

            const printWindow = window.open('', '_blank', 'width=900,height=700');
            if (!printWindow) {
                console.error('Unable to open print window.');
                return;
            }

            const html = `<!DOCTYPE html>
                <html lang="fr">
                <head>
                    <meta charset="utf-8" />
                    <title>Impression fiche patient</title>
                    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
                    <link rel="stylesheet" href="css/app.css" />
                    <style>
                        body { margin: 20px; }
                        .modal { display: block !important; }
                        .modal-backdrop { display: none !important; }
                        .btn, .btn-close { display: none !important; }
                    </style>
                </head>
                <body>${element.innerHTML}</body>
                </html>`;

            printWindow.document.open();
            printWindow.document.write(html);
            printWindow.document.close();
            printWindow.focus();
            printWindow.onload = () => {
                setTimeout(() => {
                    printWindow.print();
                    printWindow.close();
                }, 250);
            };
        };

        const getBaseUrl = () => {
            const baseElement = document.querySelector('base');
            return baseElement?.href ?? `${window.location.origin}/`;
        };

        const resolveAssetUrl = (path) => {
            return new URL(path, getBaseUrl()).href;
        };

        const getJsPDF = () => {
            return window.jsPDF ?? window.jspdf?.jsPDF ?? window.jspdf ?? null;
        };

        const ensureJsPdfAvailable = async () => {
            const loaded = getJsPDF();
            if (loaded) {
                return loaded;
            }

            if (window._jspdfLoadingPromise) {
                return window._jspdfLoadingPromise;
            }

            window._jspdfLoadingPromise = new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js';
                script.crossOrigin = 'anonymous';
                script.referrerPolicy = 'no-referrer';
                script.onload = () => {
                    const loadedJsPDF = getJsPDF();
                    if (loadedJsPDF) {
                        resolve(loadedJsPDF);
                        return;
                    }
                    reject(new Error('jsPDF chargé mais le constructeur n\'a pas été trouvé.'));
                };
                script.onerror = () => reject(new Error('Impossible de charger jsPDF depuis la source de secours.'));
                document.head.appendChild(script);
            });

            return window._jspdfLoadingPromise;
        };

        const getNumber = (obj, pascal, camel) => {
            if (!obj) return 0;
            if (obj[pascal] !== undefined && obj[pascal] !== null) return obj[pascal];
            if (obj[camel] !== undefined && obj[camel] !== null) return obj[camel];
            return 0;
        };

        const getString = (obj, pascal, camel) => {
            if (!obj) return '';
            return obj[pascal] ?? obj[camel] ?? '';
        };

        const arrayBufferToBase64 = (buffer) => {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const chunkSize = 0x8000;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return window.btoa(binary);
        };

        const loadArabicFont = async (doc) => {
            const fontUrl = 'https://raw.githubusercontent.com/googlefonts/noto-fonts/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Regular.ttf';
            const fontFileName = 'NotoNaskhArabic-Regular.ttf';
            const fontName = 'NotoNaskhArabic';

            try {
                if (!window._jspdfArabicFontBase64) {
                    const response = await fetch(fontUrl);
                    if (!response.ok) {
                        console.warn(`Impossible de charger la police arabe depuis ${fontUrl} : statut ${response.status}`);
                        return;
                    }

                    const buffer = await response.arrayBuffer();
                    window._jspdfArabicFontBase64 = arrayBufferToBase64(buffer);
                }

                if (!window._jspdfArabicFontBase64) {
                    return;
                }

                try {
                    if (typeof doc.getFontList === 'function') {
                        const fonts = doc.getFontList();
                        if (!fonts || !fonts[fontName]) {
                            doc.addFileToVFS(fontFileName, window._jspdfArabicFontBase64);
                            doc.addFont(fontFileName, fontName, 'normal');
                        }
                    } else {
                        doc.addFileToVFS(fontFileName, window._jspdfArabicFontBase64);
                        doc.addFont(fontFileName, fontName, 'normal');
                    }
                }
                catch (error) {
                    console.warn('Impossible d\'ajouter la police arabe à jsPDF :', error);
                }
            }
            catch (error) {
                console.warn('Erreur lors du chargement de la police arabe :', error);
            }
        };

        const drawLabelValue = (doc, label, value, x, y) => {
            doc.setFont('helvetica', 'bold');
            doc.text(label, x, y);
            doc.setFont('helvetica', 'normal');
            doc.text(value, x + 120, y);
        };

        const loadImageDataUrl = (src) => {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.naturalWidth;
                        canvas.height = img.naturalHeight;
                        const ctx = canvas.getContext('2d');
                        if (!ctx) {
                            console.warn('Impossible de créer le contexte canvas pour l\'image.');
                            resolve(null);
                            return;
                        }
                        ctx.drawImage(img, 0, 0);
                        resolve(canvas.toDataURL('image/png'));
                    }
                    catch (error) {
                        console.warn('Erreur lors de la conversion de l\'image en DataURL :', error);
                        resolve(null);
                    }
                };
                img.onerror = () => {
                    console.warn(`Impossible de charger l'image : ${src}`);
                    resolve(null);
                };
                img.src = src;
            });
        };

        const reshapeArabicText = (text) => {
            if (!text) {
                return '';
            }

            try {
                const reshaped = window.ArabicReshaper?.convertArabic(text) ?? text;
                return reshaped
                    .split(' ')
                    .map((word) => /[\u0600-\u06FF]/.test(word)
                        ? word.split('').reverse().join('')
                        : word)
                    .join(' ');
            }
            catch (error) {
                console.warn('Impossible de transformer le texte arabe :', error);
                return text
                    .split(' ')
                    .map((word) => /[\u0600-\u06FF]/.test(word)
                        ? word.split('').reverse().join('')
                        : word)
                    .join(' ');
            }
        };

        const renderRightHeaderImage = async (lines, width, lineHeight) => {
            const padding = 10;
            const height = Math.ceil(lines.length * lineHeight + padding * 2);
            const canvas = document.createElement('canvas');
            canvas.width = Math.ceil(width);
            canvas.height = Math.max(height, 1);
            const ctx = canvas.getContext('2d');
            if (!ctx) {
                return null;
            }

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#000000';
            ctx.font = '10pt "Noto Naskh Arabic", Arial, sans-serif';
            ctx.textAlign = 'right';
            ctx.direction = 'rtl';

            const x = canvas.width - padding;
            let y = padding + lineHeight;
            lines.forEach((line) => {
                if (line) {
                    ctx.fillText(line, x, y);
                }
                y += lineHeight;
            });

            return canvas.toDataURL('image/png');
        };

        const renderPdfHeader = async (doc, data, title, imageDataUrl) => {
            const margin = 40;
            const headerHeight = 90;
            const centerX = 297.5;
            const leftX = margin;
            const topY = 40;
            const lineSpacing = 12;
            const pageWidth = doc.internal.pageSize.getWidth();
            const cabinet = data?.cabinet ?? data?.Cabinet ?? {};
            const rightAreaWidth = 200;
            const rightAreaX = pageWidth - 40 - rightAreaWidth;
            const rightAreaRightX = rightAreaX + rightAreaWidth;

            await loadArabicFont(doc);

            if (imageDataUrl) {
                const imageSize = 48;
                doc.addImage(imageDataUrl, 'PNG', centerX - imageSize / 2, topY + 10, imageSize, imageSize);
            }

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9);

            const leftLines = [
                `${getString(cabinet, 'NomEtablissement', 'nomEtablissement')}`,
                `${getString(cabinet, 'NomCabinet', 'nomCabinet')}`,
                `${getString(cabinet, 'AdresseCabinet', 'adresseCabinet')}`,
                `Tél / GSM : ${getString(cabinet, 'Telephone', 'telephone')}`,
                `Matricule fiscal : ${getString(cabinet, 'MatriculeFiscal', 'matriculeFiscal')}`,
                `RIB/RIP : ${getString(cabinet, 'RIB', 'rib') || getString(cabinet, 'RIP', 'rip')}`
            ];

            const rightLines = [
                reshapeArabicText(getString(cabinet, 'NomKineArabe', 'nomKineArabe')),
                reshapeArabicText(getString(cabinet, 'NomEtablissementArabe', 'nomEtablissementArabe')),
                reshapeArabicText(getString(cabinet, 'NomCabinetArabe', 'nomCabinetArabe')),
                reshapeArabicText(getString(cabinet, 'AdresseKineArabe', 'adresseKineArabe')),
                reshapeArabicText(getString(cabinet, 'CodeCnam', 'codeCnam') || getString(cabinet, 'CodeEtablissement', 'codeEtablissement'))
            ];

            let currentY = topY + 20;
            leftLines.forEach((line) => {
                doc.text(line, leftX, currentY);
                currentY += lineSpacing;
            });

            currentY = topY + 20;
            const rightImageDataUrl = await renderRightHeaderImage(rightLines, rightAreaWidth, lineSpacing + 4);
            if (rightImageDataUrl) {
                const imageHeight = rightLines.length * (lineSpacing + 4) + 10;
                doc.addImage(rightImageDataUrl, 'PNG', rightAreaX, topY + 10, rightAreaWidth, imageHeight);
            }

            doc.setFont('helvetica', 'normal');
            doc.setLineWidth(0.5);
            doc.line(margin, topY + headerHeight, 555, topY + headerHeight);

            const titleY = topY + headerHeight + 15;
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(14);
            doc.text(title, centerX, titleY, { align: 'center' });

            return titleY + 20;
        };

        window.generateInvoicePdf = async (filename, data) => {
            console.log('generateInvoicePdf', filename, data);
            const jsPDFClass = await ensureJsPdfAvailable();
            if (!jsPDFClass) {
                throw new Error('jsPDF n\'est pas disponible. Vérifiez que le script jsPDF est chargé.');
            }

            const doc = new jsPDFClass({ unit: 'pt', format: 'a4' });
            await loadArabicFont(doc);
            const margin = 40;
            const iconDataUrl = await loadImageDataUrl(resolveAssetUrl('icon_caduceus.png'));
            const cabinet = data?.cabinet ?? {};
            const program = data?.program ?? {};
            const invoiceNumber = data?.invoiceNumber ?? data?.invoice_number ?? 'N/A';
            const invoiceDate = data?.invoiceDate ?? data?.invoice_date ?? 'N/A';

            let y = await renderPdfHeader(doc, data, 'FACTURE CNAM', iconDataUrl);

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(12);
            doc.text('Facture', margin, y);
            y += 18;

            const invoiceFields = [
                ['N° facture', invoiceNumber],
                ['Date facture', invoiceDate],
                ['Patient', getString(program, 'PatientName', 'patientName')],
                ['N° assurée', getString(program, 'NumeroAssuree', 'numeroAssuree')],
                ['Code patient', getString(program, 'CodePatient', 'codePatient')],
                ['Couverture', getString(program, 'Couverture', 'couverture')]
            ];

            doc.setFont('helvetica', 'normal');
            invoiceFields.forEach(([label, value]) => {
                doc.text(`${label} :`, margin, y);
                doc.text(String(value || 'N/A'), margin + 130, y);
                y += 14;
            });

            y += 16;
            doc.setFont('helvetica', 'bold');
            doc.text('Détails du programme', margin, y);
            y += 16;
            doc.setFont('helvetica', 'normal');

            const nbSeances = getNumber(program, 'NbSeances', 'nbSeances');
            const dureeSeance = getNumber(program, 'DureeSeanceMinutes', 'dureeSeanceMinutes');
            const prixUnitaire = getNumber(program, 'PrixUnitaire', 'prixUnitaire');
            const prixTTC = getNumber(program, 'PrixTTC', 'prixTTC');

            const details = [
                ['Titre', getString(program, 'Titre', 'titre')],
                ['Nature', getString(program, 'NatureSeances', 'natureSeances')],
                ['Date début', getString(program, 'DateDebut', 'dateDebut')],
                ['Date fin', getString(program, 'DateFin', 'dateFin')],
                ['Nb séances', nbSeances],
                ['Durée séance', `${dureeSeance} min`],
                ['Prix unitaire', `${prixUnitaire.toFixed(2)} DT`],
                ['Total TTC', `${prixTTC.toFixed(2)} DT`],
                ['Code bureau', getString(program, 'CodeBureau', 'codeBureau')],
                ['Année', getString(program, 'Annee', 'annee')],
                ['N° décision', getString(program, 'NumeroDecision', 'numeroDecision')],
                ['N° ordre', getString(program, 'NumeroOrdre', 'numeroOrdre')]
            ];

            details.forEach(([label, value]) => {
                if (y > 760) {
                    doc.addPage();
                    y = margin;
                }
                doc.text(`${label} :`, margin, y);
                doc.text(String(value), margin + 130, y);
                y += 14;
            });

            y += 24;
            if (y > 760) {
                doc.addPage();
                y = margin;
            }
            doc.setFont('helvetica', 'italic');
            doc.setFontSize(10);
            doc.text('Merci de conserver cette facture pour le dossier CNAM.', margin, y);
            doc.save(filename);
        };

        window.generateSignatureSheetPdf = async (filename, data) => {
            const jsPDFClass = await ensureJsPdfAvailable();
            if (!jsPDFClass) {
                throw new Error('jsPDF n\'est pas disponible. Vérifiez que le script jsPDF est chargé.');
            }

            const doc = new jsPDFClass({ unit: 'pt', format: 'a4' });
            const margin = 40;
            const iconDataUrl = await loadImageDataUrl(resolveAssetUrl('icon_caduceus.png'));
            let y = await renderPdfHeader(doc, data, 'FEUILLE DE SIGNATURE', iconDataUrl);

            const patient = data.patient ?? data.Patient ?? {};
            const program = data.program ?? data.Program ?? {};

            const patientName = `${getString(patient, 'Nom', 'nom')} ${getString(patient, 'Prenom', 'prenom')}`.trim();
            const patientCode = getString(patient, 'CodePatient', 'codePatient');
            const programTitle = getString(program, 'Titre', 'titre');
            const programNature = getString(program, 'NatureSeances', 'natureSeances');
            const programDateDebut = getString(program, 'DateDebut', 'dateDebut');
            const programDateFin = getString(program, 'DateFin', 'dateFin');

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(10);
            doc.text('Patient :', margin, y);
            doc.text(patientName, margin + 80, y);
            doc.text('Code patient :', 320, y);
            doc.text(patientCode, 420, y);
            y += 16;

            doc.text('Programme :', margin, y);
            doc.text(programTitle, margin + 80, y);
            doc.text('Nature :', 320, y);
            doc.text(programNature, 420, y);
            y += 16;

            doc.text('Date début :', margin, y);
            doc.text(programDateDebut, margin + 80, y);
            doc.text('Date fin :', 320, y);
            doc.text(programDateFin, 420, y);
            y += 24;

            const headers = ['Séance', 'Date rendez-vous', 'Signature patient', 'Signature kiné'];
            const widths = [60, 120, 165, 165];
            let x = margin;

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(10);
            headers.forEach((header, index) => {
                doc.text(header, x, y);
                x += widths[index];
            });
            y += 16;
            doc.setLineWidth(0.25);
            doc.line(margin, y, 555, y);
            y += 14;
            doc.setFont('helvetica', 'normal');

            const rows = data.rows ?? data.Rows ?? [];
            rows.forEach((row) => {
                if (y > 760) {
                    doc.addPage();
                    y = margin;
                }

                x = margin;
                const sequence = row.Sequence ?? row.sequence ?? '';
                const date = row.Date ?? row.date ?? '';
                const values = [String(sequence), String(date), '', ''];
                values.forEach((value, index) => {
                    doc.text(String(value), x, y);
                    x += widths[index];
                });
                y += 18;
            });

            y += 18;
            doc.setFontSize(9);
            doc.text('Remarques :', margin, y);
            doc.save(filename);
        };

        window.generateBordereauPdf = async (filename, data) => {
            const jsPDFClass = await ensureJsPdfAvailable();
            if (!jsPDFClass) {
                throw new Error('jsPDF n\'est pas disponible. Vérifiez que le script jsPDF est chargé.');
            }

            const doc = new jsPDFClass({ unit: 'pt', format: 'a4' });
            const margin = 40;
            const iconDataUrl = await loadImageDataUrl('icon_caduceus.png');
            let y = await renderPdfHeader(doc, data, 'BORDEREAU CNAM', iconDataUrl);
            const formatNumber = (value) => Number(value ?? 0).toFixed(3);
            const summary = data.summary ?? data.Summary ?? {};
            const rows = data.rows ?? data.Rows ?? [];

            doc.setFontSize(10);
            doc.text(`Date : ${summary.Date ?? summary.date ?? ''}`, margin, y);
            doc.text(`Centre : ${summary.Centre ?? summary.centre ?? ''}`, 260, y);
            doc.text(`Nbre séances : ${summary.NbreSeances ?? summary.nbreSeances ?? 0}`, 520, y, { align: 'right' });
            y += 16;
            doc.text(`Année : ${summary.Annee ?? summary.annee ?? ''}`, margin, y);
            doc.text(`Nb factures : ${summary.NbFactures ?? summary.nbFactures ?? 0}`, 260, y);
            doc.text(`Montant total TTC : ${formatNumber(summary.MontantTotalTTC ?? summary.montantTotalTTC)} DT`, 520, y, { align: 'right' });
            y += 20;

            doc.setLineWidth(0.5);
            doc.line(margin, y, 555, y);
            y += 16;

            const headers = ['N° facture', 'Date facture', 'Prise en charge', 'N° assuré', 'Assuré', 'M. HT', 'M TVA', 'M TTC'];
            const widths = [70, 70, 90, 70, 100, 55, 55, 55];
            let x = margin;

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(10);
            headers.forEach((header, index) => {
                doc.text(header, x, y);
                x += widths[index];
            });
            y += 16;
            doc.setLineWidth(0.25);
            doc.line(margin, y, 555, y);
            y += 14;
            doc.setFont('helvetica', 'normal');

            (rows || []).forEach((row) => {
                if (y > 760) {
                    doc.addPage();
                    y = margin;
                }
                x = margin;
                const values = [
                    row.FactureNumber ?? row.factureNumber ?? '',
                    row.DateFacture ?? row.dateFacture ?? '',
                    row.PriseEnCharge ?? row.priseEnCharge ?? '',
                    row.NumeroAssuree ?? row.numeroAssuree ?? '',
                    row.PatientName ?? row.patientName ?? '',
                    formatNumber(row.MontantHT ?? row.montantHT),
                    formatNumber(row.MontantTVA ?? row.montantTVA),
                    formatNumber(row.MontantTTC ?? row.montantTTC)
                ];
                values.forEach((value, index) => {
                    doc.text(String(value), x, y);
                    x += widths[index];
                });
                y += 16;
            });

            y += 18;
            doc.setLineWidth(0.5);
            doc.line(margin, y, 555, y);
            y += 16;
            doc.setFont('helvetica', 'bold');
            doc.text('Total général TTC :', margin, y);
            doc.text(formatNumber(summary.MontantTotalTTC ?? summary.montantTotalTTC) + ' DT', 555, y, { align: 'right' });

            doc.save(filename);
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
